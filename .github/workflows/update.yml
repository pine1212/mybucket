name: Update Manifests

# Check every manifest in the bucket for a newer upstream version once a day
# and commit the changes straight to main.
# NOTE: every run: block must stay pure ASCII. GitHub writes run blocks into a
# BOM-less UTF-8 temp .ps1 and Windows PowerShell 5.1 reads them as ANSI, which
# mangles non-ASCII characters and breaks quoting.
# Prerequisites: Actions must be enabled on GitHub and Workflow permissions set
# to "Read and write".
on:
  schedule:
    # daily at 00:00 UTC (08:00 UTC+8); GitHub may delay it by 5-30 minutes
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: 'Only update this manifest (name without .json); empty means all'
        required: false
        default: ''
      force:
        description: 'Force update: re-fetch hash even if version is unchanged'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-manifests
  cancel-in-progress: false

jobs:
  update:
    name: Check & Update
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      # checkver talks to the GitHub API; a token avoids the 60 req/h anonymous limit
      SCOOP_GH_TOKEN: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
      # branch to commit to (default main); change here if the default branch is renamed
      TARGET_BRANCH: main
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # with BOT_TOKEN (PAT) configured, the push also triggers other workflows;
          # otherwise it falls back to GITHUB_TOKEN
          token: ${{ secrets.BOT_TOKEN || github.token }}

      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: 'scoop_core'

      - name: Setup git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Update manifests
        run: |
          $env:SCOOP_HOME = Convert-Path '.\scoop_core'
          $app = '${{ inputs.app }}'.Trim()
          $force = '${{ inputs.force }}' -eq 'true'

          if ($app) {
            if ($force) { .\bin\checkver.ps1 $app -u -f } else { .\bin\checkver.ps1 $app -u }
          } else {
            if ($force) { .\bin\checkver.ps1 -u -f } else { .\bin\checkver.ps1 -u }
          }

          # normalize indentation to 4 spaces after checkver rewrote manifests
          .\bin\formatjson.ps1

      - name: Report manifests without checkver
        run: |
          $env:SCOOP_HOME = Convert-Path '.\scoop_core'
          $out = (.\bin\missing-checkver.ps1 2>&1 | Out-String).Trim()
          if (-not $out) { $out = '(none)' }
          $summary = $env:GITHUB_STEP_SUMMARY
          "### Manifests missing checkver / autoupdate" | Out-File -FilePath $summary -Encoding ascii
          '```' | Out-File -FilePath $summary -Append -Encoding ascii
          $out | Out-File -FilePath $summary -Append -Encoding ascii
          '```' | Out-File -FilePath $summary -Append -Encoding ascii

      - name: Detect changes
        id: diff
        run: |
          # limit to bucket/ so the checked out scoop_core/ is not treated as a change
          $changed = @(git status --porcelain -- bucket)
          "count=$($changed.Count)" >> $env:GITHUB_OUTPUT
          "changed=$(if ($changed.Count -gt 0) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          $changed | ForEach-Object { Write-Host "changed: $_" }

      - name: Commit and push to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add -A -- bucket
          git commit -m "chore: auto update ${{ steps.diff.outputs.count }} manifest(s)"
          # rebase on the latest main so a manual commit the same day cannot reject the push
          git pull --rebase origin $env:TARGET_BRANCH
          git push origin HEAD:$env:TARGET_BRANCH
