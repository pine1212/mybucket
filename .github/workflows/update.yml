name: Update Manifests

# 每日自动检查 bucket 内清单的上游版本，有更新时改写 manifest 并开 PR。
# 注意：所有 run: 块必须保持纯 ASCII —— GitHub 会把 run 块写成无 BOM 的 UTF-8 临时
# 脚本，Windows PowerShell 5.1 按 ANSI 读取会导致中文乱码并使引号解析失败。
# 依赖：推送到 GitHub 后 Actions 需开启，且 Workflow permissions 为 Read and write。
on:
  schedule:
    # 每天 01:00 UTC（北京时间 09:00，GitHub 可能有 5~30 分钟延迟）
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: 'Only update this manifest (name without .json); empty means all'
        required: false
        default: ''
      force:
        description: 'Force update: re-fetch hash even if version is unchanged'
        type: boolean
        default: false
      mode:
        description: 'How to land the update'
        type: choice
        default: pr
        options:
          - pr
          - direct

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-manifests
  cancel-in-progress: false

jobs:
  update:
    name: Check & Update
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      # checkver talks to the GitHub API; a token avoids the 60 req/h anonymous limit
      SCOOP_GH_TOKEN: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
      # token for gh CLI; with BOT_TOKEN (PAT) the created PR also triggers other workflows
      GH_TOKEN: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BOT_TOKEN || github.token }}

      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: 'scoop_core'

      - name: Setup git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Disable GitHub download proxy
        # Some Scoop builds prepend https://v4.gh-proxy.org/ to GitHub download urls.
        # GitHub-hosted runners reach GitHub directly, so turn it off.
        run: |
          $cfg = Join-Path $env:USERPROFILE '.config/scoop/config.json'
          New-Item -ItemType Directory -Force (Split-Path $cfg) | Out-Null
          [System.IO.File]::WriteAllText($cfg, '{ "gh_proxy_enabled": false }')

      - name: Update manifests
        run: |
          $env:SCOOP_HOME = Convert-Path '.\scoop_core'
          $app = '${{ inputs.app }}'.Trim()
          $force = '${{ inputs.force }}' -eq 'true'

          if ($app) {
            if ($force) { .\bin\checkver.ps1 $app -u -f } else { .\bin\checkver.ps1 $app -u }
          } else {
            if ($force) { .\bin\checkver.ps1 -u -f } else { .\bin\checkver.ps1 -u }
          }

          # normalize indentation to 4 spaces after checkver rewrote manifests
          .\bin\formatjson.ps1

      - name: Report manifests without checkver
        run: |
          $env:SCOOP_HOME = Convert-Path '.\scoop_core'
          $out = (.\bin\missing-checkver.ps1 2>&1 | Out-String).Trim()
          if (-not $out) { $out = '(none)' }
          $summary = $env:GITHUB_STEP_SUMMARY
          "### Manifests missing checkver / autoupdate" | Out-File -FilePath $summary -Encoding ascii
          '```' | Out-File -FilePath $summary -Append -Encoding ascii
          $out | Out-File -FilePath $summary -Append -Encoding ascii
          '```' | Out-File -FilePath $summary -Append -Encoding ascii

      - name: Detect changes
        id: diff
        run: |
          # limit to bucket/ so the checked out scoop_core/ is not treated as a change
          $changed = @(git status --porcelain -- bucket)
          "count=$($changed.Count)" >> $env:GITHUB_OUTPUT
          "changed=$(if ($changed.Count -gt 0) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          $changed | ForEach-Object { Write-Host "changed: $_" }

      - name: Commit and open pull request
        if: steps.diff.outputs.changed == 'true' && (inputs.mode != 'direct')
        run: |
          $branch = "auto-update/$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          git switch -c $branch
          git add -A -- bucket
          git commit -m "chore: auto update ${{ steps.diff.outputs.count }} manifest(s)"
          git push -u origin $branch
          gh pr create `
            --base '${{ github.ref_name }}' `
            --head $branch `
            --title 'chore: auto update manifests' `
            --body "Generated by the Update Manifests workflow ($(git rev-parse --short HEAD))."
          if ($LASTEXITCODE -ne 0) { Write-Warning "Failed to create PR (ignorable if it already exists); branch $branch was pushed." }

      - name: Commit and push directly
        if: steps.diff.outputs.changed == 'true' && inputs.mode == 'direct'
        run: |
          git add -A -- bucket
          git commit -m "chore: auto update ${{ steps.diff.outputs.count }} manifest(s)"
          git push origin HEAD:'${{ github.ref_name }}'
